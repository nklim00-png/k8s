apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: kube-system
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      # =========================================================================
      # [핵심] 마스터 및 컨트롤 플레인 노드 스케줄링 허용 설정
      # =========================================================================
      tolerations:
      - key: node-role.kubernetes.io/control-plane # 최신 쿠버네티스 버전의 컨트롤 플레인 테인트 허용
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master        # 구버전 쿠버네티스의 마스터 테인트 허용
        operator: Exists
        effect: NoSchedule
      # =========================================================================
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.8.0
        ports:
        - containerPort: 9100
          hostPort: 9100
          name: metrics
        resources:
          limits:
            cpu: 100m # 1000m 1코어
            memory: 50Mi
          requests:
            cpu: 50m
            memory: 50Mi
        securityContext:
          privileged: true
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /rootfs
          readOnly: true
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
