apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
  # annotations:
  #   kubernetes.io/ingress.class: "nginx" # AWS ALB, HAProxy, F5, Envoy ...
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /blue
        pathType: Prefix
        backend:
          service:
            name: blue-service
            port:
              number: 80
      - path: /green
        pathType: Prefix
        backend:
          service:
            name: green-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: default-service
            port:
              number: 80
