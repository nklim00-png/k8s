apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: multi-container-pod
spec:
  containers:

    # 앱 컨테이너 A: nginx (포트 90)
    - name: app-container-a
      image: nginx
      command: ["/bin/sh", "-c"]
      args:
        - |
          sed -i 's/listen\(.*\)80;/listen\190;/' /etc/nginx/conf.d/default.conf
          exec /docker-entrypoint.sh nginx -g 'daemon off;'
      ports:
        - containerPort: 90
          protocol: TCP

    # 앱 컨테이너 B: app server (포트 9090)
    # nginx와 localhost로 통신 가능 (동일 네트워크 네임스페이스)
    - name: app-container-b
      image: node:20-alpine
      command:
        - node
        - -e
        - |
          const http = require('http');
          http.createServer((req, res) => {
            res.writeHead(200);
            res.end('app-server OK\n');
          }).listen(9090, () => console.log('Listening on :9090'));
      ports:
        - containerPort: 9090
          protocol: TCP
