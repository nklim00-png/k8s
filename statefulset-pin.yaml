# ---------------------------------------------------------------------
# Headless Service : 파드별 DNS (web-0.web, web-1.web, web-2.web)
#   selector를 파드 라벨(app: nginx)과 일치시킴
# ---------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None
  selector:
    app: nginx
  ports:
  - port: 80
    name: web
---
# ---------------------------------------------------------------------
# StatefulSet
#   PVC 이름 = <volumeClaimTemplates명>-<sts명>-<순번>
#            = data-web-0, data-web-1, data-web-2
#   -> claimRef로 예약된 PV에 바인딩 -> PV nodeAffinity의 노드로 스케줄링
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: "web"
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "manual"
      resources:
        requests:
          storage: 1Gi
---
# ---------------------------------------------------------------------
# 외부 노출용 Service
# ---------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: lb-svc
spec:
  type: LoadBalancer
  #externalIPs:
  #- 172.16.0.201
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
