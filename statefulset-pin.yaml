
# ---------------------------------------------------------------------
# PV 1 : worker1 고정, data-web-0 PVC 전용
# ---------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-volume-1
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  claimRef:
    namespace: default
    name: data-web-0
  hostPath:
    path: /mnt/data-1
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: ["worker1"]
---
